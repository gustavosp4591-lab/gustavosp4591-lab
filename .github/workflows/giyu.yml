name: gerar giyu das contribuicoes

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: baixar o repositorio
        uses: actions/checkout@v4

      - name: gerar o svg do Giyu
        run: python3 scripts/giyu_contrib.py
        env:
          GH_USER: ${{ github.repository_owner }}

      - name: enviar para a branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
