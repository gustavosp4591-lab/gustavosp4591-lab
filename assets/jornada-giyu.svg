<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-label="Jornada: início em ADS na FIAP em agosto de 2025, base em HTML, CSS e Python, portfólio publicado, agora SQL e bancos de dados, próximo passo primeiros projetos de Dados, conclusão prevista em 2027.">
  <title>Jornada</title>
  <style>.it{animation:ent .7s ease-out both}@keyframes ent{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
